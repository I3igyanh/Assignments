<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carousel</title>
    <link rel="stylesheet" href="carousel.css">
</head>
<body>
    <header>
    <h1>My Carousel</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    </header>
    <section class="carousel-wrap">
  <h2>Featured This Week</h2>
  <div class="carousel">
    <div class="slides">
      <article class="slide">
        <img src="iphone.jpg" alt="Slide 1">
        <p>Slide 1 Content</p>
      </article>
      <article class="slide">
        <img src="laptop.jpg" alt="Slide 2">
        <p>Slide 2 Content</p>
      </article>
      <article class="slide">
        <img src="phone.jpg" alt="Slide 3">
        <p>Slide 3 Content</p>
      </article>
    </div>
  </div>
</section>
</body>
</html>
