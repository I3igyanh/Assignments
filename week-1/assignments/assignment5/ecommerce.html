<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecommerce</title>
    <link rel="stylesheet" href="ecom.css">
</head>
<body>
    <div class="shop-layout">
 
    <!-- Header -->
    <header class="shop-header">
      <h1>ShopGrid</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Men</a>
        <a href="#">Women</a>
        <a href="#">Sale</a>
      </nav>
    </header>
 
    <!-- Sidebar -->
    <aside class="shop-sidebar">
 
      <div class="filter-group">
        <h2>Categories</h2>
        <ul>
          <li>All Products</li>
          <li>Clothing</li>
          <li>Footwear</li>
          <li>Accessories</li>
          <li>Electronics</li>
        </ul>
      </div>
    </aside>
 
    <!-- Product Grid -->
    <main class="shop-main"> 
      <section class="product-grid">
 
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=200&fit=crop" alt="Watch" />
          <div class="card-body">
            <h3>Classic Watch</h3>
            <p class="price">67</p>
            <button>Add to Cart</button>
          </div>
        </article>
 
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=400&h=200&fit=crop" alt="Sneakers" />
          <div class="card-body">
            <h3>Running Sneakers</h3>
            <p class="price">670</p>
            <button>Add to Cart</button>
          </div>
        </article>
 
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400&h=200&fit=crop" alt="Camera" />
          <div class="card-body">
            <h3>Instant Camera</h3>
            <p class="price">67</p>
            <button>Add to Cart</button>
          </div>
        </article>
 
        <article class="product-card">
          <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=400&h=200&fit=crop" alt="Perfume" />
          <div class="card-body">
            <h3>Signature Perfume</h3>
            <p class="price">67</p>
            <button>Add to Cart</button>
          </div>
        </article>
 
      </section>
    </main>
    
</body>
</html>
